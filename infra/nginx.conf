# MK Paper Mill ERP — nginx reverse proxy + TLS
# Place at: /etc/nginx/sites-available/mkerp
# Enable:   sudo ln -s /etc/nginx/sites-available/mkerp /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
#
# TLS cert (Let's Encrypt):
#   sudo certbot --nginx -d erp.mkpapermill.com

server {
    listen 80;
    server_name erp.mkpapermill.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.mkpapermill.com;

    # --- TLS (certbot fills these) ---
    ssl_certificate     /etc/letsencrypt/live/erp.mkpapermill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.mkpapermill.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # --- Proxy to Node/Express ---
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # --- Static asset caching (React build served by Express) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Upload limit (for any file uploads)
    client_max_body_size 10M;

    # Access log
    access_log /var/log/nginx/mkerp_access.log;
    error_log  /var/log/nginx/mkerp_error.log;
}
